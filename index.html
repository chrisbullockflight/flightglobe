<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Flight Log — Navigation Display</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap');

  :root{
    --bg: #05070a;
    --panel: #0a1017;
    --panel-border: #1c2f38;
    --cyan: #4fd8e8;
    --cyan-dim: #2a6b74;
    --amber: #ffb547;
    --green: #6ee7a0;
    --white: #eef7f9;
    --dim: #6c8891;
    --red: #ff6b6b;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(ellipse at 50% 40%, #0a1319 0%, #05070a 60%, #020304 100%);
    overflow:hidden;
    overscroll-behavior:none;
    -webkit-text-size-adjust:none;
    font-family:'JetBrains Mono', monospace;
    color: var(--white);
  }

  #stage{ position:relative; width:100vw; height:100vh; height:100dvh; }
  #globeCanvas{
    position:absolute; inset:0; display:block;
    touch-action:none; /* stop iOS Safari's native pinch/scroll so drag+pinch drive the globe instead */
    -webkit-tap-highlight-color: transparent;
  }

  /* subtle scanline / vignette to sell the "display" feel */
  #vignette{
    position:absolute; inset:0; pointer-events:none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    z-index:5;
  }
  #scanlines{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    background: repeating-linear-gradient(180deg, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 2px, transparent 3px);
    mix-blend-mode: overlay;
  }

  /* header / footer HUD bars */
  .hud-bar{
    position:absolute; left:0; right:0; z-index:8;
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 22px;
    pointer-events:none;
  }
  #topbar{ top:0; border-bottom:1px solid rgba(79,216,232,0.15); }
  #botbar{ bottom:0; border-top:1px solid rgba(79,216,232,0.15); }

  .callsign{
    font-size:12px; letter-spacing:3px; color:var(--cyan); font-weight:700;
    text-shadow: 0 0 8px rgba(79,216,232,0.5);
  }
  .callsign span{ color:var(--dim); font-weight:400; letter-spacing:2px; }

  .badge{
    font-size:10px; letter-spacing:2px; color:var(--green);
    border:1px solid rgba(110,231,160,0.35); padding:4px 10px; border-radius:2px;
    background: rgba(110,231,160,0.05);
  }

  #modeToggle{
    color:var(--cyan); border-color:rgba(79,216,232,0.35); background:rgba(79,216,232,0.05);
    transition: background 0.15s ease, color 0.15s ease;
  }
  #modeToggle:hover{ background:rgba(79,216,232,0.15); }
  #modeToggle.day{ color:var(--amber); border-color:rgba(255,181,71,0.4); background:rgba(255,181,71,0.06); }
  #modeToggle.day:hover{ background:rgba(255,181,71,0.16); }

  /* floating readout panels */
  .panel{
    position:absolute; z-index:7;
    background: linear-gradient(180deg, rgba(10,16,23,0.82), rgba(6,10,15,0.88));
    border: 1px solid var(--panel-border);
    border-radius: 3px;
    padding: 10px 14px;
    min-width: 128px;
    backdrop-filter: blur(2px);
    box-shadow: 0 0 22px rgba(0,0,0,0.4), inset 0 0 18px rgba(79,216,232,0.03);
    animation: drift 7s ease-in-out infinite;
    pointer-events:none;
  }
  .panel::before{
    content:''; position:absolute; top:0; left:0; width:8px; height:8px;
    border-top:1px solid var(--cyan-dim); border-left:1px solid var(--cyan-dim);
  }
  .panel::after{
    content:''; position:absolute; bottom:0; right:0; width:8px; height:8px;
    border-bottom:1px solid var(--cyan-dim); border-right:1px solid var(--cyan-dim);
  }
  .panel .label{
    font-size:9.5px; letter-spacing:1.6px; color:var(--dim); margin-bottom:4px;
  }
  .panel .value{
    font-size:22px; font-weight:700; color:var(--cyan);
    text-shadow: 0 0 10px rgba(79,216,232,0.45);
    line-height:1.1;
  }
  .panel .value.amber{ color:var(--amber); text-shadow:0 0 10px rgba(255,181,71,0.45); }
  .panel .value.green{ color:var(--green); text-shadow:0 0 10px rgba(110,231,160,0.45); }
  .panel .sub{
    font-size:10px; color:var(--dim); margin-top:3px; letter-spacing:0.5px;
  }

  @keyframes drift{
    0%{ transform: translateY(0px); }
    50%{ transform: translateY(-9px); }
    100%{ transform: translateY(0px); }
  }

  /* destinations list panel */
  #destPanel{ min-width:200px; }
  #destPanel .row{
    display:flex; justify-content:space-between; font-size:11px;
    padding:2px 0; color:var(--white); border-bottom:1px dotted rgba(108,136,145,0.2);
  }
  #destPanel .row:last-child{ border-bottom:none; }
  #destPanel .row .code{ color:var(--cyan); font-weight:700; letter-spacing:1px; }
  #destPanel .row .n{ color:var(--amber); }

  /* center title (fades after load) */
  #introTitle{
    position:absolute; z-index:9; left:50%; top:46%; transform:translate(-50%,-50%);
    text-align:center; pointer-events:none;
    animation: fadeOut 1.2s ease forwards 2.6s;
  }
  #introTitle h1{
    margin:0; font-size:15px; letter-spacing:6px; color:var(--cyan); font-weight:700;
    text-shadow:0 0 14px rgba(79,216,232,0.6);
  }
  #introTitle p{ margin:6px 0 0; font-size:10px; letter-spacing:3px; color:var(--dim); }
  @keyframes fadeOut{ to{ opacity:0; visibility:hidden; } }

  #hint{
    position:absolute; z-index:8; bottom:54px; left:50%; transform:translateX(-50%);
    font-size:9.5px; letter-spacing:2px; color:var(--dim); pointer-events:none;
  }

  #tooltip{
    position:absolute; z-index:12; pointer-events:none;
    background: linear-gradient(180deg, rgba(10,16,23,0.95), rgba(6,10,15,0.97));
    border:1px solid var(--cyan-dim); border-radius:3px;
    padding: 8px 12px; min-width:150px;
    box-shadow: 0 0 24px rgba(0,0,0,0.55), 0 0 14px rgba(79,216,232,0.12);
    opacity:0; transform:translate(-50%, calc(-100% - 14px)) scale(0.96);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }
  #tooltip.show{ opacity:1; transform:translate(-50%, calc(-100% - 14px)) scale(1); }
  #tooltip::after{
    content:''; position:absolute; left:50%; bottom:-6px; transform:translateX(-50%);
    width:0; height:0; border-left:6px solid transparent; border-right:6px solid transparent;
    border-top:6px solid var(--cyan-dim);
  }
  #tooltip .t-code{
    font-size:15px; font-weight:700; letter-spacing:2px; color:var(--cyan);
    text-shadow:0 0 8px rgba(79,216,232,0.5);
  }
  #tooltip .t-code.home{ color:var(--amber); text-shadow:0 0 8px rgba(255,181,71,0.5); }
  #tooltip .t-city{ font-size:11px; color:var(--white); margin-top:2px; }
  #tooltip .t-country{ font-size:9.5px; color:var(--dim); letter-spacing:1px; margin-top:1px; }
  #tooltip .t-divider{ height:1px; background:rgba(79,216,232,0.15); margin:6px 0; }
  #tooltip .t-row{ display:flex; justify-content:space-between; font-size:10px; margin-top:2px; }
  #tooltip .t-row .k{ color:var(--dim); letter-spacing:0.5px; }
  #tooltip .t-row .v{ color:var(--green); font-weight:700; }
  #tooltip .t-flag{
    display:inline-block; margin-top:5px; font-size:9px; letter-spacing:1.5px;
    color:var(--amber); border:1px solid rgba(255,181,71,0.35); padding:2px 6px; border-radius:2px;
  }

  @media (max-width: 820px){
    .panel{ min-width:104px; padding:8px 10px; }
    .panel .value{ font-size:17px; }
    .panel .label{ font-size:8.5px; }
    #destPanel{ display:none; }
  }
</style>
</head>

</div>

  { id:'p-legs',      label:'SECTORS FLOWN',     value:fmt(DATA.num_legs),                                                                        sub:`avg ${DATA.fun_facts.avg_leg_hours} hrs / leg`, cls:'amber' },
  { id:'p-airports',  label:'AIRPORTS VISITED',  value:DATA.num_airports,                                                                          sub:`home base: ${DATA.home_base}`, cls:'green' },
  { id:'p-countries', label:'COUNTRIES',         value:DATA.num_countries,                                                                          sub:`${DATA.distinct_tails} aircraft flown` },
  { id:'p-longest',   label:'LONGEST SECTOR',    value:`${DATA.longest_leg.hours}<span style="font-size:12px;color:var(--dim)"> HRS</span>`,       sub:`${DATA.longest_leg.from} → ${DATA.longest_leg.to}`, cls:'amber' },
  { id:'p-distance',  label:'DISTANCE FLOWN',    value:`${fmt(DATA.total_distance_km)}<span style="font-size:11px;color:var(--dim)"> KM</span>`,   sub:`${DATA.fun_facts.earth_circumnavigations}× around Earth` },

];
PANELS.forEach(p => renderPanel(p.id, p.label, p.value, p.sub, p.cls));

const destRows = DATA.top_airports
  .map(a => `<div class="row"><span class="code">${a.code}</span><span>${a.city}</span><span class="n">${a.visits}</span></div>`)
  .join('');
document.getElementById('destPanel').innerHTML =
  `<div class="label" style="margin-bottom:6px;">TOP DESTINATIONS</div>${destRows}`;

document.getElementById('rangeLabel').textContent = `LOGBOOK RANGE  ${DATA.date_start}  →  ${DATA.date_end}`;
document.getElementById('dateLabel').textContent = `${DATA.num_sectors_incl_sim} TOTAL ENTRIES INCL. SIM`;

// show dest panel on wider screens
if (window.innerWidth > 900) document.getElementById('destPanel').style.display = 'block';

// ---------- three.js globe ----------
const canvas = document.getElementById('globeCanvas');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 6.4);

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 3));
renderer.setSize(window.innerWidth, window.innerHeight);

const globeGroup = new THREE.Group();
scene.add(globeGroup);

const R = 2.0;

// two stacked globes, one per mode, so switching is just a visibility toggle
const sphereGeo = new THREE.SphereGeometry(R, 128, 128);

const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');

// reliable official three.js example asset mirrors (checked in this order)
const TEX_HOSTS = [
  'https://threejs.org/examples/textures/planets/',
  'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/',
  'https://unpkg.com/three@0.128.0/examples/textures/planets/'
];
const maxAnisotropy = renderer.capabilities.getMaxAnisotropy();

// loads a texture (falling back across hosts on failure), then sharpens it with
// anisotropic filtering + correct color space so it reads crisply at any angle
function loadTexture(filename, onLoad, { isColorMap=false } = {}){
  let i = 0;
  function applyQuality(tex){
    tex.anisotropy = maxAnisotropy;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    if(isColorMap && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
  }
  function tryNext(){
    if(i >= TEX_HOSTS.length){ console.warn('Failed to load texture:', filename); return; }
    texLoader.load(TEX_HOSTS[i] + filename, (tex)=> onLoad(applyQuality(tex)), undefined, ()=>{ i++; tryNext(); });
  }
  tryNext();
}

// --- NIGHT globe: unlit city-lights composite, matches the cockpit HUD look ---
const nightMat = new THREE.MeshBasicMaterial({ color: 0x0a1015 });
const nightGlobe = new THREE.Mesh(sphereGeo, nightMat);
globeGroup.add(nightGlobe);
loadTexture('earth_lights_2048.png', (tex)=>{
  nightMat.map = tex;
  nightMat.color.set(0x9fd0dd); // cool cyan tint so city lights read as HUD, not photo
  nightMat.needsUpdate = true;
}, { isColorMap:true });

// --- DAY globe: real color map + terrain normal map (relief) + ocean specular ---
const dayMat = new THREE.MeshPhongMaterial({ color: 0xffffff, shininess: 6 });
const dayGlobe = new THREE.Mesh(sphereGeo, dayMat);
dayGlobe.visible = false;
globeGroup.add(dayGlobe);
loadTexture('earth_atmos_2048.jpg', (tex)=>{ dayMat.map = tex; dayMat.needsUpdate = true; }, { isColorMap:true });
loadTexture('earth_normal_2048.jpg', (tex)=>{ dayMat.normalMap = tex; dayMat.normalScale = new THREE.Vector2(0.85,0.85); dayMat.needsUpdate = true; });
loadTexture('earth_specular_2048.jpg', (tex)=>{ dayMat.specularMap = tex; dayMat.specular = new THREE.Color(0x556677); dayMat.needsUpdate = true; });

// thin cloud layer, day mode only, drifts slowly for a bit of life
const cloudGeo = new THREE.SphereGeometry(R*1.008, 64, 64);
const cloudMat = new THREE.MeshLambertMaterial({ transparent:true, opacity:0.55, depthWrite:false });
const clouds = new THREE.Mesh(cloudGeo, cloudMat);
clouds.visible = false;
globeGroup.add(clouds);
loadTexture('earth_clouds_1024.png', (tex)=>{ cloudMat.map = tex; cloudMat.alphaMap = tex; cloudMat.needsUpdate = true; }, { isColorMap:true });

// sun-style lighting (only really affects the day globe's Phong shading)
const sunLight = new THREE.DirectionalLight(0xffffff, 1.15);
sunLight.position.set(5, 2, 3);
scene.add(sunLight);
const ambientLight = new THREE.AmbientLight(0x445566, 0.55);
scene.add(ambientLight);

// ---------- day / night mode toggle ----------
let dayMode = false;
const modeBtn = document.getElementById('modeToggle');
function setDayMode(on){
  dayMode = on;
  dayGlobe.visible = on;
  clouds.visible = on;
  nightGlobe.visible = !on;
  modeBtn.textContent = on ? '☀ DAY MODE' : '☾ NIGHT MODE';
  modeBtn.classList.toggle('day', on);
}
modeBtn.addEventListener('click', ()=> setDayMode(!dayMode));
setDayMode(false);

// graticule (lat/long grid) - cyan wireframe, avionics ND style
function makeGraticule(){
  const group = new THREE.Group();
  const mat = new THREE.LineBasicMaterial({ color: 0x2a6b74, transparent:true, opacity:0.35 });
  // latitude rings
  for(let lat=-60; lat<=60; lat+=30){
    const pts = [];
    const phi = (90-lat) * Math.PI/180;
    for(let i=0;i<=64;i++){
      const theta = (i/64) * Math.PI*2;
      pts.push(new THREE.Vector3(
        R*Math.sin(phi)*Math.cos(theta),
        R*Math.cos(phi),
        R*Math.sin(phi)*Math.sin(theta)
      ));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    group.add(new THREE.LineLoop(geo, mat));
  }
  // longitude lines
  for(let lon=0; lon<360; lon+=30){
    const pts = [];
    const theta = lon * Math.PI/180;
    for(let i=0;i<=64;i++){
      const phi = (i/64) * Math.PI;
      pts.push(new THREE.Vector3(
        R*Math.sin(phi)*Math.cos(theta),
        R*Math.cos(phi),
        R*Math.sin(phi)*Math.sin(theta)
      ));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    group.add(new THREE.Line(geo, mat));
  }
  return group;
}
globeGroup.add(makeGraticule());

// faint outer atmosphere glow
const glowGeo = new THREE.SphereGeometry(R*1.035, 48, 48);
const glowMat = new THREE.MeshBasicMaterial({ color:0x4fd8e8, transparent:true, opacity:0.06, side:THREE.BackSide });
globeGroup.add(new THREE.Mesh(glowGeo, glowMat));

function latLonToVec3(lat, lon, radius){
  const phi = (90-lat) * Math.PI/180;
  const theta = (lon+180) * Math.PI/180;
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

// airport markers
const homeCode = DATA.home_base;
const airportMeshes = []; // hoverable meshes (marker + invisible hit-sphere)
const visibleMarkers = []; // just the colored marker spheres, for hover-scale animation

// how many distinct routes touch each airport, for the tooltip
const routeCountByAirport = {};
DATA.routes.forEach(r=>{
  routeCountByAirport[r.a] = (routeCountByAirport[r.a]||0) + 1;
  routeCountByAirport[r.b] = (routeCountByAirport[r.b]||0) + 1;
});

DATA.airports.forEach(ap=>{
  const pos = latLonToVec3(ap.lat, ap.lon, R*1.003);
  const isHome = ap.code === homeCode;
  const size = isHome ? 0.028 : Math.min(0.008 + ap.visits*0.0009, 0.02);
  const geo = new THREE.SphereGeometry(size, 10, 10);
  const mat = new THREE.MeshBasicMaterial({ color: isHome ? 0xffb547 : 0x4fd8e8 });
  const marker = new THREE.Mesh(geo, mat);
  marker.position.copy(pos);
  globeGroup.add(marker);

  const info = {
    code: ap.code, city: ap.city, country: ap.country,
    visits: ap.visits, isHome, routes: routeCountByAirport[ap.code]||0
  };
  marker.userData = info;
  marker.userData.markerMesh = marker;

  // generous invisible hit-sphere so small markers are easy to hover/tap
  const hitGeo = new THREE.SphereGeometry(Math.max(size*3.2, 0.05), 8, 8);
  const hitMat = new THREE.MeshBasicMaterial({ visible:false });
  const hitSphere = new THREE.Mesh(hitGeo, hitMat);
  hitSphere.position.copy(pos);
  hitSphere.userData = info;
  hitSphere.userData.markerMesh = marker;
  globeGroup.add(hitSphere);

  airportMeshes.push(marker, hitSphere);
  visibleMarkers.push(marker);

  if(isHome){
    // pulsing ring for home base
    const ringGeo = new THREE.RingGeometry(size*1.8, size*2.4, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color:0xffb547, transparent:true, opacity:0.5, side:THREE.DoubleSide });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(pos);
    ring.lookAt(0,0,0);
    globeGroup.add(ring);
    ring.userData.pulse = true;
    globeGroup.userData.homeRing = ring;
  }
});

// great-circle route arcs
function greatCircleArc(latA, lonA, latB, lonB, segments=64, heightFactor=0.28){
  const a = latLonToVec3(latA, lonA, R);
  const b = latLonToVec3(latB, lonB, R);
  const angle = a.angleTo(b);
  const points = [];
  const axis = new THREE.Vector3().crossVectors(a,b).normalize();
  for(let i=0;i<=segments;i++){
    const t = i/segments;
    const theta = angle*t;
    const quat = new THREE.Quaternion().setFromAxisAngle(axis, theta);
    const p = a.clone().applyQuaternion(quat);
    const lift = 1 + Math.sin(Math.PI*t) * heightFactor * (angle/Math.PI);
    p.multiplyScalar(lift);
    points.push(p);
  }
  return points;
}

const apLookup = {};
DATA.airports.forEach(a=> apLookup[a.code]=a);

const maxCount = Math.max(...DATA.routes.map(r=>r.count));
DATA.routes.forEach(r=>{
  const A = apLookup[r.a], B = apLookup[r.b];
  if(!A || !B) return;
  const pts = greatCircleArc(A.lat, A.lon, B.lat, B.lon);
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const opacity = 0.12 + (r.count/maxCount)*0.55;
  const isHomeRoute = (r.a===homeCode || r.b===homeCode);
  const mat = new THREE.LineBasicMaterial({
    color: isHomeRoute ? 0x4fd8e8 : 0x6ee7a0,
    transparent:true,
    opacity: opacity
  });
  globeGroup.add(new THREE.Line(geo, mat));
});

// starfield background
function makeStars(){
  const count = 900;
  const positions = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r = 40 + Math.random()*60;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos((Math.random()*2)-1);
    positions[i*3] = r*Math.sin(phi)*Math.cos(theta);
    positions[i*3+1] = r*Math.sin(phi)*Math.sin(theta);
    positions[i*3+2] = r*Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions,3));
  const mat = new THREE.PointsMaterial({ color:0x9fd8e0, size:0.06, transparent:true, opacity:0.55 });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars());

// ---------- interaction: drag to orbit, scroll to zoom, hover for info ----------
let isDragging = false;
let prevX=0, prevY=0;
let rotVelX=0, rotVelY=0;
let autoRotate = true;

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
let hoveredMesh = null;

function setHover(mesh, clientX, clientY){
  if(hoveredMesh === mesh) {
    if(mesh){ positionTooltip(clientX, clientY); }
    return;
  }
  hoveredMesh = mesh;
  if(!mesh){
    tooltip.classList.remove('show');
    canvas.style.cursor = isDragging ? 'grabbing' : 'grab';
    return;
  }
  canvas.style.cursor = 'pointer';
  const d = mesh.userData;
  tooltip.innerHTML = `
    <div class="t-code ${d.isHome?'home':''}">${d.code}</div>
    <div class="t-city">${d.city}</div>
    <div class="t-country">${d.country.toUpperCase()}</div>
    <div class="t-divider"></div>
    <div class="t-row"><span class="k">SECTORS</span><span class="v">${d.visits}</span></div>
    <div class="t-row"><span class="k">ROUTES</span><span class="v">${d.routes}</span></div>
    ${d.isHome ? '<div class="t-flag">HOME BASE</div>' : ''}
  `;
  tooltip.classList.add('show');
  positionTooltip(clientX, clientY);
}

function positionTooltip(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  tooltip.style.left = (clientX - rect.left) + 'px';
  tooltip.style.top = (clientY - rect.top) + 'px';
}

function updateHover(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(airportMeshes, false);
  if(hits.length){
    setHover(hits[0].object, clientX, clientY);
  } else {
    setHover(null, clientX, clientY);
  }
}

let downX=0, downY=0, downTime=0;

canvas.addEventListener('pointerdown', (e)=>{
  isDragging = true; autoRotate = false;
  prevX = e.clientX; prevY = e.clientY;
  downX = e.clientX; downY = e.clientY; downTime = performance.now();
});
window.addEventListener('pointerup', (e)=>{
  isDragging=false;
  canvas.style.cursor = hoveredMesh ? 'pointer' : 'grab';
  // a tap (little movement, short duration) should still show the tooltip,
  // since a stationary touch never fires pointermove on iOS
  const moved = Math.hypot(e.clientX - downX, e.clientY - downY);
  const duration = performance.now() - downTime;
  if(moved < 8 && duration < 500){
    updateHover(e.clientX, e.clientY);
  }
});
window.addEventListener('pointermove', (e)=>{
  if(isDragging){
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    rotVelY = dx * 0.005;
    rotVelX = dy * 0.005;
    globeGroup.rotation.y += rotVelY;
    globeGroup.rotation.x += rotVelX;
    globeGroup.rotation.x = Math.max(-1.1, Math.min(1.1, globeGroup.rotation.x));
    prevX = e.clientX; prevY = e.clientY;
    setHover(null, e.clientX, e.clientY);
    return;
  }
  updateHover(e.clientX, e.clientY);
});
canvas.addEventListener('pointerleave', ()=>{ setHover(null, 0, 0); });
canvas.addEventListener('wheel', (e)=>{
  e.preventDefault();
  camera.position.z += e.deltaY * 0.003;
  camera.position.z = Math.max(3.2, Math.min(12, camera.position.z));
}, { passive:false });

// pinch-to-zoom (touch devices have no wheel event)
let pinchStartDist = null;
let pinchStartZ = null;
function touchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}
canvas.addEventListener('touchstart', (e)=>{
  if(e.touches.length === 2){
    isDragging = false; autoRotate = false;
    pinchStartDist = touchDist(e.touches);
    pinchStartZ = camera.position.z;
  }
}, { passive:true });
canvas.addEventListener('touchmove', (e)=>{
  if(e.touches.length === 2 && pinchStartDist){
    e.preventDefault();
    const dist = touchDist(e.touches);
    const scale = pinchStartDist / dist;
    camera.position.z = Math.max(3.2, Math.min(12, pinchStartZ * scale));
  }
}, { passive:false });
canvas.addEventListener('touchend', (e)=>{
  if(e.touches.length < 2) pinchStartDist = null;
}, { passive:true });

globeGroup.rotation.x = 0.25;
globeGroup.rotation.y = -1.2;

let t0 = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const t = performance.now();
  const dt = (t - t0)/1000; t0 = t;

  if(autoRotate){
    globeGroup.rotation.y += dt * 0.06;
  } else {
    // gentle inertia decay
    globeGroup.rotation.y += rotVelY * 0.02;
    globeGroup.rotation.x += rotVelX * 0.02;
    rotVelX *= 0.9; rotVelY *= 0.9;
  }

  clouds.rotation.y += dt * 0.014; // slow independent drift, only visible in day mode

  const ring = globeGroup.userData.homeRing;
  if(ring){
    const s = 1 + Math.sin(t*0.003)*0.25;
    ring.scale.set(s,s,s);
  }

  // pulse the hovered marker; ease every other marker back to its resting size
  const activeMarker = hoveredMesh ? hoveredMesh.userData.markerMesh : null;
  visibleMarkers.forEach(m=>{
    const target = (m === activeMarker) ? 2.1 : 1.0;
    m.scale.x += (target - m.scale.x) * 0.25;
    m.scale.y += (target - m.scale.y) * 0.25;
    m.scale.z += (target - m.scale.z) * 0.25;
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
